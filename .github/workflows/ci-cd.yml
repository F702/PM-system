name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

# Pull requests need only the read-only token. Deployment credentials are available
# exclusively to pushes to main through the protected production environment.
permissions:
  contents: read

jobs:
  ci:
    name: Check, test, and build
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      # The deployment job uses exactly the output that passed the checks above;
      # it does not rebuild application code on the production server.
      - name: Package verified release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-${{ github.sha }}
          path: |
            dist/
            package.json
            package-lock.json
            prisma/
            scripts/backup.mjs
            scripts/smoke.mjs
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    environment:
      name: production
    # Serialize only production releases. PR validation remains fully parallel.
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Download verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ github.sha }}
          path: release

      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload verified release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p /opt/project-manager/releases/${GITHUB_SHA}"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p ${DEPLOY_PORT:-22}" \
            release/ "$DEPLOY_USER@$DEPLOY_HOST:/opt/project-manager/releases/${GITHUB_SHA}/"

      - name: Back up, migrate, and prepare release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "GITHUB_SHA=$GITHUB_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          release="/opt/project-manager/releases/${GITHUB_SHA}"
          test -f /opt/project-manager/shared/.env
          cd "$release"
          npm ci
          npm run prisma:generate
          set -a
          . /opt/project-manager/shared/.env
          set +a
          export NODE_ENV=production
          npm run backup
          npm run prisma:migrate
          npm run db:seed
          npm prune --omit=dev
          REMOTE

      - name: Activate release
        id: activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "GITHUB_SHA=$GITHUB_SHA bash -se" <<'REMOTE'
          set -euo pipefail
          release="/opt/project-manager/releases/${GITHUB_SHA}"
          previous="$(readlink -f /opt/project-manager/current 2>/dev/null || true)"
          if [ -n "$previous" ] && [ "$previous" != "$release" ]; then
            printf '%s\n' "$previous" > /opt/project-manager/.previous-release
          fi
          ln -sfn "$release" /opt/project-manager/current
          sudo systemctl restart project-manager-api
          REMOTE

      - name: Verify deployed service
        id: verify
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$APP_URL"
          node release/scripts/smoke.mjs

      # This rolls back only the application symlink. It intentionally never rolls
      # back the database: Prisma migrations must be backward-compatible (expand/
      # contract) until a later release removes obsolete schema.
      - name: Roll back application on activation or smoke-test failure
        if: ${{ always() && (steps.activate.outcome == 'failure' || steps.verify.outcome == 'failure') }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" bash -se <<'REMOTE'
          set -euo pipefail
          previous="$(cat /opt/project-manager/.previous-release 2>/dev/null || true)"
          if [ -z "$previous" ] || [ ! -d "$previous" ]; then
            echo "No usable previous release is available; manual recovery is required."
            exit 1
          fi
          ln -sfn "$previous" /opt/project-manager/current
          sudo systemctl restart project-manager-api
          echo "Rolled back application to $previous"
          REMOTE
